    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfbf8" />
    <script>
      // Apply the documentation preference before the first paint.
      if (/^#\/docs(?:\/|$)/.test(location.hash)) {
        let theme;
        try { theme = localStorage.getItem("spark-docs-theme"); } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.docsTheme = theme;
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').content = "#171b18";
      }
    </script>
    <meta
      name="description"
